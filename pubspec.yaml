name: smartstore_lite
description: "Offline-First Inventory Management System for SmartStore Lite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # HTTP Client & Interceptors
  dio: ^5.4.3+1

  # Firebase Suite (Free Spark Plan)
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1

  # Local Database Storage & Encryption
  sqflite_sqlcipher: ^3.0.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # Voice Recognition & Text-to-Speech
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0

  # Notifications & Local Storage
  flutter_local_notifications: ^17.1.2
  shared_preferences: ^2.2.3

  # Charts, CSV & Utilities
  fl_chart: ^0.68.0
  csv: ^6.0.0
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/