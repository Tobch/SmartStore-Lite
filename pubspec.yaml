name: smartstore_lite
description: "Offline-First Inventory Management System for SmartStore Lite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  dio: ^5.4.3+1
  firebase_core: ^3.15.2
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  sqflite_sqlcipher: ^3.0.3
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  flutter_local_notifications: ^17.1.2
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  csv: ^6.0.0
  intl: ^0.19.0
  uuid: ^4.4.0
  lottie: ^3.1.2 # ADDED: For enterprise splash animation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1 # ADDED: To generate unique app icon

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/ # ADDED: Directory for lottie JSON files